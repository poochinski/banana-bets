<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Banana Bets monochrome slip logo</title>
  <desc id="desc">A gray rounded square with a dark outlined banana, chart bars, and rising arrow.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e5e8"/>
      <stop offset="1" stop-color="#bcc0c5"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5259"/>
      <stop offset="1" stop-color="#2f3339"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#tile)"/>

  <g filter="url(#softShadow)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="94" y="92" width="21" height="51" rx="7" fill="url(#bar)" stroke="#eef0f2" stroke-width="2"/>
    <rect x="120" y="77" width="21" height="66" rx="7" fill="url(#bar)" stroke="#eef0f2" stroke-width="2"/>
    <rect x="146" y="60" width="21" height="83" rx="7" fill="url(#bar)" stroke="#eef0f2" stroke-width="2"/>

    <path d="M80 82c28-13 53-31 78-57" fill="none" stroke="#363a40" stroke-width="10"/>
    <path d="M153 24l26-5-6 27" fill="#363a40" stroke="#eef0f2" stroke-width="3"/>

    <path d="M63 100c6 33 28 57 58 66 31 9 66-2 85-29-8 39-38 68-77 73-43 5-83-22-97-64-6-17-7-34-3-51 2-7 10-10 16-6 6 3 10 7 18 11z"
      fill="none" stroke="#34383e" stroke-width="12"/>
    <path d="M59 128c15 25 40 40 69 43 30 3 58-7 79-28" fill="none" stroke="#eef0f2" stroke-width="5"/>
    <path d="M58 128c15 25 40 40 69 43 30 3 58-7 79-28" fill="none" stroke="#4b5057" stroke-width="3"/>
  </g>
</svg>
